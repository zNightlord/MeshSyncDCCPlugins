name: Build MeshSync Blender Plugin (Windows)

on:
  push:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
  workflow_dispatch:
    inputs:
      meshsync_version:
        description: 'MeshSync package version (e.g. 0.18.0-preview)'
        required: true
        default: '0.18.0-preview'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Poco
  # ─────────────────────────────────────────────────────────────────────────
  build-poco:
    name: Build Poco
    runs-on: windows-2022
    steps:
      - name: Cache Poco install
        id: cache-poco
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Download & build Poco
        if: steps.cache-poco.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          curl -fsSL -o poco-src.zip https://github.com/pocoproject/poco/archive/poco-1.13.3-release.zip
          tar -xf poco-src.zip
          cmake -S poco-poco-1.13.3-release -B poco-build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\poco-install" -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=OFF -DENABLE_SAMPLES=OFF
          cmake --build poco-build --config Release
          cmake --install poco-build --config Release

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the Blender 5.1.0 plugin
  # ─────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Blender 5.1.0
    needs: build-poco
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Poco cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      # ── Blender 5.1.0 Windows install ────────────────────────────────────
      - name: Cache Blender 5.1.0 install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\blender-installs\5.1.0
          key: blender-install-5.1.0

      - name: Download & extract Blender 5.1.0
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip  = "${{ runner.temp }}\blender-5.1.0-windows-x64.zip"
          $dest = "${{ github.workspace }}\blender-installs\5.1.0"
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "${{ runner.temp }}\blender-extract" -Force
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "${{ runner.temp }}\blender-extract\blender-5.1.0-windows-x64\*" $dest

      # ── Python 3.11.3 source (provides PC/pyconfig.h) ────────────────────
      # The bat script downloads Python source to Plugins~/Build/Python-3.11.3/
      # but the download fails silently in CI. We pre-populate the folder.
      # PC/pyconfig.h is a static Windows-specific config included by Python.h.
      - name: Cache Python 3.11.3 source
        id: cache-python
        uses: actions/cache@v4
        with:
          path: Plugins~\Build\Python-3.13.9
          key: python-src-3.11.3

      - name: Download Python 3.13.9 Dev
        shell: pwsh
        run: |
          $pyDest = "Plugins~\Build\Python-3.13.9"
          $nugetDest = "${{ runner.temp }}\python-nuget"
          
          # Install the python nuget package (tools only for headers/libs)
          nuget install python -Version 3.13.9 -OutputDirectory $nugetDest
          
          $pyRoot = Get-ChildItem -Path "$nugetDest\python*" | Select-Object -First 1
          
          # Create the structure MeshSync expects
          New-Item -ItemType Directory -Force -Path "$pyDest\Include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pyDest\PC" | Out-Null
          
          # Copy precompiled headers
          Copy-Item "$($pyRoot.FullName)\tools\include\*" "$pyDest\Include\" -Recurse -Force
          # Nuget pre-compiles pyconfig.h into the include folder; copy it to PC for MeshSync
          Copy-Item "$($pyRoot.FullName)\tools\include\pyconfig.h" "$pyDest\PC\pyconfig.h" -Force
          
          Write-Host "Python 3.13.9 Dev headers staged at $pyDest"

      # ── Cache fmtlib headers ──────────────────────────────────────────────
      - name: Cache fmtlib 10.2.1
        id: cache-fmtlib
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\fmtlib
          key: fmtlib-10.2.1

      - name: Download fmtlib 10.2.1
        if: steps.cache-fmtlib.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "${{ runner.temp }}\fmt.zip"
          Invoke-WebRequest -Uri "https://github.com/fmtlib/fmt/archive/refs/tags/10.2.1.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "${{ runner.temp }}\fmtlib" -Force

      # ── Generate solution ─────────────────────────────────────────────────
      # The bat script also downloads the Blender source headers to
      # Plugins~/Build/blender-5.1.0/ — we need this to run BEFORE we can
      # stage fmtlib, because the target directory doesn't exist yet.
      - name: Generate solution (make_meshsync_dcc_plugin.bat)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          set Poco_DIR=%GITHUB_WORKSPACE%\poco-install
          set BLENDER_PATH=%GITHUB_WORKSPACE%\blender-installs\5.1.0
          set MESHSYNC_VER=${{ github.event.inputs.meshsync_version || '0.18.0-preview' }}
          make_meshsync_dcc_plugin.bat %MESHSYNC_VER% -DBUILD_BLENDER_5.1.0_PLUGIN=ON

      # ── Stage fmtlib into the blenlib include path (fmt/ranges.h fix) ─────
      # Root cause: BLI_string_ref.hh line 35 does #include <fmt/ranges.h>.
      # Blender's extern/fmtlib is not downloaded by the bat script, so the
      # compiler can't find it.
      #
      # The compiler include path already contains blenlib:
      #   /I"...\Build\blender-5.1.0\source\blender\blenlib"
      #
      # So placing fmt/ inside blenlib/ makes the include resolve without
      # any changes to the generated vcxproj or CMake files.
      #
      # IMPORTANT: this step must run AFTER make_meshsync_dcc_plugin.bat
      # because the bat creates the blender-5.1.0 source directory.
      - name: Stage fmtlib into blenlib
        shell: pwsh
        run: |
          $blenlib = "Plugins~\Build\blender-5.1.0\source\blender\blenlib"
          $fmtSrc  = "${{ runner.temp }}\fmtlib\fmt-10.2.1\include\fmt"
          $fmtDest = "$blenlib\fmt"

          if (!(Test-Path $blenlib)) {
            Write-Error "blenlib not found at $blenlib — bat script did not download Blender source"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $fmtDest | Out-Null
          Copy-Item "$fmtSrc\*" $fmtDest -Force

          if (!(Test-Path "$fmtDest\ranges.h")) {
            Write-Error "fmt/ranges.h missing after staging"; exit 1
          }
          Write-Host "fmt/ranges.h staged OK"

      # ── msbuild ──────────────────────────────────────────────────────────
      - name: Build (msbuild)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild MeshSyncDCCPlugins.sln /t:Build /p:Configuration=Release /p:Platform=x64 /m /nologo

      # ── Install ───────────────────────────────────────────────────────────
      - name: Install (cmake_install.cmake)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $outName = "UnityMeshSync_Blender_5.1.0_Windows"
          $distDir = Get-ChildItem "Plugins~\Dist" -Directory |
                       Where-Object { $_.Name -match "Blender" -and $_.Name -match "5\.1" } |
                       Select-Object -First 1
          if (-not $distDir) {
            Write-Error "Dist folder not found. Contents:"; Get-ChildItem "Plugins~\Dist"; exit 1
          }
          Compress-Archive -Path "$($distDir.FullName)\*" -DestinationPath "${outName}.zip" -Force
          Write-Host "Packaged: ${outName}.zip"

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityMeshSync-Blender-5.1.0-Windows
          path: UnityMeshSync_Blender_5.1.0_Windows.zip      
