# .github/workflows/windows.yml
#
# Builds the MeshSync Blender plugin for Windows against:
#   Blender 4.5.0 | 5.0.0 | 5.1.0 | 5.2.0
#
# Build process mirrors the official docs:
#   1. make_meshsync_dcc_plugin.bat <version> <optional_args>
#   2. msbuild MeshSyncDCCPlugins.sln /t:Build /p:Configuration=Release ...
#   3. cmake -DBUILD_TYPE=Release -P cmake_install.cmake

name: Build MeshSync Blender Plugin (Windows)

on:
  push:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
  workflow_dispatch:
    inputs:
      meshsync_version:
        description: 'MeshSync package version (e.g. 0.18.0-preview)'
        required: true
        default: '0.18.0-preview'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Poco static libs once — cached across all matrix jobs
  # ─────────────────────────────────────────────────────────────────────────
  build-poco:
    name: Build Poco
    runs-on: windows-2022

    steps:
      - name: Cache Poco install
        id: cache-poco
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Download & build Poco (static, Release)
        if: steps.cache-poco.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          curl -fsSL -o poco-src.zip https://github.com/pocoproject/poco/archive/poco-1.13.3-release.zip
          tar -xf poco-src.zip

          cmake ^
            -S poco-poco-1.13.3-release ^
            -B poco-build ^
            -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\poco-install" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DENABLE_TESTS=OFF ^
            -DENABLE_SAMPLES=OFF

          cmake --build poco-build --config Release
          cmake --install poco-build --config Release

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the plugin for each Blender version in parallel
  # ─────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Blender ${{ matrix.blender.version }}
    needs: build-poco
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        blender:
          # ── 4.5.0 ────────────────────────────────────────────────────────
          - version: "4.5.0"
            cmake_flag: "BUILD_BLENDER_4.5.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender4.5/blender-4.5.0-windows-x64.zip"
            zip_name: "blender-4.5.0-windows-x64.zip"
            inner_dir: "blender-4.5.0-windows-x64"
            # Python source the bat downloads to Plugins~/Build/Python-X.Y.Z/
            # Check build log include paths to confirm exact patch version.
            python_src_version: "3.12.9"
            python_src_url: "https://www.python.org/ftp/python/3.12.9/Python-3.12.9.tgz"

          # ── 5.0.0 ────────────────────────────────────────────────────────
          - version: "5.0.0"
            cmake_flag: "BUILD_BLENDER_5.0.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.0/blender-5.0.0-windows-x64.zip"
            zip_name: "blender-5.0.0-windows-x64.zip"
            inner_dir: "blender-5.0.0-windows-x64"
            python_src_version: "3.13.9"
            python_src_url: "https://www.python.org/ftp/python/3.13.9/Python-3.13.9.tgz"

          # ── 5.1.0 ────────────────────────────────────────────────────────
          # Update download_url when 5.1 ships final release.
          - version: "5.1.0"
            cmake_flag: "BUILD_BLENDER_5.1.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.zip"
            zip_name: "blender-5.1.0-windows-x64.zip"
            inner_dir: "blender-5.1.0-windows-x64"
            python_src_version: "3.13.9"
            python_src_url: "https://www.python.org/ftp/python/3.13.9/Python-3.13.9.tgz"

          # ── 5.2.0 ────────────────────────────────────────────────────────
          # Update download_url when 5.2 ships final release.
          - version: "5.2.0"
            cmake_flag: "BUILD_BLENDER_5.2.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip"
            zip_name: "blender-5.2.0-windows-x64.zip"
            inner_dir: "blender-5.2.0-windows-x64"
            python_src_version: "3.13.9"
            python_src_url: "https://www.python.org/ftp/python/3.13.9/Python-3.13.9.tgz"

    steps:
      # ── Checkout with submodules ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Restore Poco ─────────────────────────────────────────────────────
      - name: Restore Poco cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      # ── Blender install ───────────────────────────────────────────────────
      - name: Cache Blender install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\blender-installs\${{ matrix.blender.version }}
          key: blender-install-${{ matrix.blender.version }}

      - name: Download & extract Blender ${{ matrix.blender.version }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip  = "${{ runner.temp }}\${{ matrix.blender.zip_name }}"
          $dest = "${{ github.workspace }}\blender-installs\${{ matrix.blender.version }}"

          Invoke-WebRequest -Uri "${{ matrix.blender.download_url }}" `
                            -OutFile $zip -UseBasicParsing

          Expand-Archive -Path $zip `
                         -DestinationPath "${{ runner.temp }}\blender-extract" `
                         -Force

          $inner = "${{ runner.temp }}\blender-extract\${{ matrix.blender.inner_dir }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "$inner\*" $dest

      # ── Pre-download Python source ────────────────────────────────────────
      # Root cause of pyconfig.h error:
      # make_meshsync_dcc_plugin.bat downloads Python source to
      # Plugins~/Build/Python-X.Y.Z/ but the download fails silently in CI,
      # leaving PC/pyconfig.h missing. We pre-populate the folder so the bat
      # finds it already there and skips its own download attempt.
      #
      # pyconfig.h on Windows lives in CPython source at PC/pyconfig.h.
      # Python.h at line 14 does #include "pyconfig.h", which resolves via
      # the /I"...\PC" compiler flag already set in the generated vcxproj.
      - name: Cache Python ${{ matrix.blender.python_src_version }} source
        id: cache-python-src
        uses: actions/cache@v4
        with:
          path: Plugins~\Build\Python-${{ matrix.blender.python_src_version }}
          key: python-src-${{ matrix.blender.python_src_version }}

      - name: Download Python ${{ matrix.blender.python_src_version }} source
        if: steps.cache-python-src.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver      = "${{ matrix.blender.python_src_version }}"
          $tgz      = "${{ runner.temp }}\Python-${ver}.tgz"
          $extract  = "${{ runner.temp }}\python-src-extract"
          $dest     = "Plugins~\Build\Python-${ver}"

          Invoke-WebRequest -Uri "${{ matrix.blender.python_src_url }}" `
                            -OutFile $tgz -UseBasicParsing

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $tgz -C $extract

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "$extract\Python-${ver}\*" $dest

          if (!(Test-Path "$dest\PC\pyconfig.h")) {
            Write-Error "PC\pyconfig.h missing after extraction — check Python source version"
            exit 1
          }
          Write-Host "pyconfig.h verified at $dest\PC\pyconfig.h"

      # ── Generate solution ─────────────────────────────────────────────────
      # Poco_DIR     : bat reads this to find Poco's CMake config
      # BLENDER_PATH : bat reads this to locate the Blender install directory
      - name: Generate solution (make_meshsync_dcc_plugin.bat)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          set Poco_DIR=%GITHUB_WORKSPACE%\poco-install
          set BLENDER_PATH=%GITHUB_WORKSPACE%\blender-installs\${{ matrix.blender.version }}
          set MESHSYNC_VER=${{ github.event.inputs.meshsync_version || '0.18.0-preview' }}

          make_meshsync_dcc_plugin.bat %MESHSYNC_VER% -D${{ matrix.blender.cmake_flag }}=ON

      # ── msbuild ──────────────────────────────────────────────────────────
      - name: Build (msbuild)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild MeshSyncDCCPlugins.sln ^
            /t:Build ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m /nologo

      # ── Install ───────────────────────────────────────────────────────────
      - name: Install (cmake_install.cmake)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $ver     = "${{ matrix.blender.version }}"
          $short   = ($ver -split '\.')[0..1] -join '.'
          $outName = "UnityMeshSync_Blender_${ver}_Windows"

          $distDir = Get-ChildItem "Plugins~\Dist" -Directory -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -match "Blender" -and $_.Name -match $short } |
                       Select-Object -First 1

          if (-not $distDir) {
            Write-Error "Dist folder for Blender $short not found. Contents of Plugins~\Dist:"
            Get-ChildItem "Plugins~\Dist" | Format-List
            exit 1
          }

          Compress-Archive -Path "$($distDir.FullName)\*" `
                           -DestinationPath "${outName}.zip" -Force
          Write-Host "Packaged: ${outName}.zip"

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityMeshSync-Blender-${{ matrix.blender.version }}-Windows
          path: "UnityMeshSync_Blender_${{ matrix.blender.version }}_Windows.zip"
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Create a GitHub Release when a version tag (v*) is pushed
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
          generate_release_notes: true
