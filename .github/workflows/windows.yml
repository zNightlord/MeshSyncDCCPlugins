name: Build MeshSync Blender Plugin (Windows)

on:
  push:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
  workflow_dispatch:
    inputs:
      meshsync_version:
        description: 'MeshSync package version (e.g. 0.18.0-preview)'
        required: true
        default: '0.18.0-preview'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Poco static libs
  # ─────────────────────────────────────────────────────────────────────────
  build-poco:
    name: Build Poco
    runs-on: windows-2022
    steps:
      - name: Cache Poco install
        id: cache-poco
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Download & build Poco
        if: steps.cache-poco.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          curl -fsSL -o poco-src.zip https://github.com/pocoproject/poco/archive/poco-1.13.3-release.zip
          tar -xf poco-src.zip
          cmake -S poco-poco-1.13.3-release -B poco-build -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\poco-install" -DBUILD_SHARED_LIBS=OFF -DENABLE_TESTS=OFF -DENABLE_SAMPLES=OFF
          cmake --build poco-build --config Release
          cmake --install poco-build --config Release

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the Blender 5.1.0 plugin
  # ─────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Blender 5.1.0
    needs: build-poco
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Poco cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Cache Blender 5.1.0 install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\blender-installs\5.1.0
          key: blender-install-5.1.0

      - name: Download & extract Blender 5.1.0
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip  = "${{ runner.temp }}\blender-5.1.0-windows-x64.zip"
          $dest = "${{ github.workspace }}\blender-installs\5.1.0"
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "${{ runner.temp }}\blender-extract" -Force
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "${{ runner.temp }}\blender-extract\blender-5.1.0-windows-x64\*" $dest

      # ── Set up Python Dev headers from Blender ───────────────────────────
      # We point MeshSync to the headers already included in Blender's zip.
      # Blender structure: 5.1\python\include\Python.h & pyconfig.h
      - name: Setup Python 3.13.9 Dev Headers
        shell: pwsh
        run: |
          $pyDest = "Plugins~\Build\Python-3.13.9"
          $blenderPyInclude = "${{ github.workspace }}\blender-installs\5.1.0\5.1\python\include"
          
          # Create the structure MeshSync's python.cmake expects
          New-Item -ItemType Directory -Force -Path "$pyDest\Include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pyDest\PC" | Out-Null
          
          # Copy headers to Include and specifically pyconfig.h to PC
          Copy-Item "$blenderPyInclude\*" "$pyDest\Include\" -Recurse -Force
          Copy-Item "$blenderPyInclude\pyconfig.h" "$pyDest\PC\pyconfig.h" -Force
          
          Write-Host "Verified pyconfig.h at $pyDest\PC\pyconfig.h"

      - name: Generate solution (make_meshsync_dcc_plugin.bat)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          set Poco_DIR=%GITHUB_WORKSPACE%\poco-install
          set BLENDER_PATH=%GITHUB_WORKSPACE%\blender-installs\5.1.0
          set MESHSYNC_VER=${{ github.event.inputs.meshsync_version || '0.18.0-preview' }}
          make_meshsync_dcc_plugin.bat %MESHSYNC_VER% -DBUILD_BLENDER_5.1.0_PLUGIN=ON

      - name: Build (msbuild)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild MeshSyncDCCPlugins.sln /t:Build /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Install (cmake_install.cmake)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake

      - name: Package artifact
        shell: pwsh
        run: |
          $outName = "UnityMeshSync_Blender_5.1.0_Windows"
          $distDir = Get-ChildItem "Plugins~\Dist" -Directory | Where-Object { $_.Name -match "Blender" -and $_.Name -match "5\.1" } | Select-Object -First 1
          Compress-Archive -Path "$($distDir.FullName)\*" -DestinationPath "${outName}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityMeshSync-Blender-5.1.0-Windows
          path: UnityMeshSync_Blender_5.1.0_Windows.zip
