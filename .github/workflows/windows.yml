name: Build MeshSync Blender Plugin (Windows)

on:
  push:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
  workflow_dispatch:
    inputs:
      meshsync_version:
        description: 'MeshSync package version (e.g. 0.18.0-preview)'
        required: true
        default: '0.18.0-preview'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Poco static libs once — cached across runs
  # ─────────────────────────────────────────────────────────────────────────
  build-poco:
    name: Build Poco
    runs-on: windows-2022

    steps:
      - name: Cache Poco install
        id: cache-poco
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Download & build Poco (static, Release)
        if: steps.cache-poco.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          curl -fsSL -o poco-src.zip https://github.com/pocoproject/poco/archive/poco-1.13.3-release.zip
          tar -xf poco-src.zip

          cmake ^
            -S poco-poco-1.13.3-release ^
            -B poco-build ^
            -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\poco-install" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DENABLE_TESTS=OFF ^
            -DENABLE_SAMPLES=OFF

          cmake --build poco-build --config Release
          cmake --install poco-build --config Release

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the Blender 5.1.0 plugin
  # ─────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Blender 5.1.0
    needs: build-poco
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Poco cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\poco-install
          key: poco-1.13.3-vs2022-x64-release

      - name: Cache Blender 5.1.0 install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\blender-installs\5.1.0
          key: blender-install-5.1.0

      - name: Download & extract Blender 5.1.0
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip  = "${{ runner.temp }}\blender-5.1.0-windows-x64.zip"
          $dest = "${{ github.workspace }}\blender-installs\5.1.0"
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.zip" `
                            -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "${{ runner.temp }}\blender-extract" -Force
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "${{ runner.temp }}\blender-extract\blender-5.1.0-windows-x64\*" $dest

      # ── Pre-download Python 3.11.3 source ────────────────────────────────
      - name: Cache Python 3.11.3 source
        id: cache-python-src
        uses: actions/cache@v4
        with:
          path: Plugins~\Build\Python-3.11.3
          key: python-src-3.11.3

      - name: Download Python 3.11.3 source
        if: steps.cache-python-src.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver     = "3.11.3"
          $tgz     = "${{ runner.temp }}\Python-$ver.tgz"
          $extract = "${{ runner.temp }}\python-src-extract"
          $dest    = "Plugins~\Build\Python-$ver"

          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$ver/Python-$ver.tgz" `
                            -OutFile $tgz -UseBasicParsing

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $tgz -C $extract

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "$extract\Python-$ver\*" $dest

          if (!(Test-Path "$dest\PC\pyconfig.h")) {
            Write-Error "PC\pyconfig.h missing after extraction"
            exit 1
          }
          Write-Host "pyconfig.h verified at $dest\PC\pyconfig.h"

      # ── Generate solution ─────────────────────────────────────────────────
      - name: Generate solution (make_meshsync_dcc_plugin.bat)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          set Poco_DIR=%GITHUB_WORKSPACE%\poco-install
          set BLENDER_PATH=%GITHUB_WORKSPACE%\blender-installs\5.1.0
          set MESHSYNC_VER=${{ github.event.inputs.meshsync_version || '0.18.0-preview' }}
          
          :: Force path to the specific 3.11.3 source we downloaded
          set PYTHON_SOURCE_DIR=%GITHUB_WORKSPACE%\Plugins~\Build\Python-3.11.3

          make_meshsync_dcc_plugin.bat %MESHSYNC_VER% ^
            -DBUILD_BLENDER_5.1.0_PLUGIN=ON ^
            -DPYTHON_VERSION=3.11.3 ^
            -DPYTHON_SOURCE_DIR="%PYTHON_SOURCE_DIR%"

      # ── msbuild ──────────────────────────────────────────────────────────
      - name: Build (msbuild)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild MeshSyncDCCPlugins.sln ^
            /t:Build ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m /nologo

      # ── Install ───────────────────────────────────────────────────────────
      - name: Install (cmake_install.cmake)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package artifact
        shell: pwsh
        run: |
          $outName = "UnityMeshSync_Blender_5.1.0_Windows"
          $distDir = Get-ChildItem "Plugins~\Dist" -Directory -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -match "Blender" -and $_.Name -match "5\.1" } |
                       Select-Object -First 1

          if (-not $distDir) {
            Write-Error "Dist folder for Blender 5.1 not found."
            exit 1
          }

          Compress-Archive -Path "$($distDir.FullName)\*" `
                           -DestinationPath "${outName}.zip" -Force

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityMeshSync-Blender-5.1.0-Windows
          path: UnityMeshSync_Blender_5.1.0_Windows.zip
