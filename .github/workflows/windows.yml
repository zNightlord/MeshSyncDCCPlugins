# .github/workflows/windows.yml
#
# Builds the MeshSync Blender plugin for Windows against:
#   Blender 4.5.0 | 5.0.0 | 5.1.0 | 5.2.0
#
# Build process mirrors the official docs exactly:
#   1. make_meshsync_dcc_plugin.bat <version> <optional_args>
#   2. msbuild MeshSyncDCCPlugins.sln /t:Build /p:Configuration=Release ...
#   3. cmake -DBUILD_TYPE=Release -P cmake_install.cmake
#
# Prerequisites on the runner (all pre-installed on windows-2022):
#   - Visual Studio 2022 with MSVC + Windows SDK
#   - CMake 3.18+
#   - git
#
# The only external dependency to set up is Poco (static libs) and
# the Blender Windows zip (the plain install directory — no source clone needed).
#
# Triggered on:
#   - push/PR to build or dev branches touching Plugins~
#   - manual dispatch

name: Build MeshSync Blender Plugin (Windows)

on:
  push:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [build, dev]
    paths:
      - 'Plugins~/**'
  workflow_dispatch:
    inputs:
      meshsync_version:
        description: 'MeshSync package version (e.g. 0.18.0)'
        required: true
        default: '0.18.0-preview'

env:
  # ── Poco ──────────────────────────────────────────────────────────────────
  # The official docs use Poco 1.10.1; 1.13.3 is the latest compatible release.
  # Poco_DIR env var is what make_meshsync_dcc_plugin.bat reads.
  POCO_VERSION: "1.13.3"
  Poco_DIR: ${{ github.workspace }}\poco-install

  # ── Blender install roots ─────────────────────────────────────────────────
  # Each matrix entry extracts its Blender zip into a versioned subfolder here.
  BLENDER_ROOT: ${{ github.workspace }}\blender-installs

  # ── MeshSync version (overridden by workflow_dispatch input if provided) ───
  MESHSYNC_VERSION: ${{ github.event.inputs.meshsync_version || '0.18.0-preview' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Build Poco static libs once — cached across all matrix jobs
  # ─────────────────────────────────────────────────────────────────────────
  build-poco:
    name: Build Poco
    runs-on: windows-2022

    steps:
      - name: Cache Poco install
        id: cache-poco
        uses: actions/cache@v4
        with:
          path: ${{ env.Poco_DIR }}
          key: poco-${{ env.POCO_VERSION }}-vs2022-x64-release

      - name: Download & build Poco (static, Release)
        if: steps.cache-poco.outputs.cache-hit != 'true'
        shell: cmd
        # Use a Developer Command Prompt context so cl.exe is on PATH.
        # actions/setup-msvc is not needed — windows-2022 ships VS2022.
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          set VER=%POCO_VERSION%
          set URL=https://github.com/pocoproject/poco/archive/poco-%VER%-release.zip
          curl -fsSL -o poco-src.zip %URL%
          tar -xf poco-src.zip
          set SRCDIR=poco-poco-%VER%-release

          cmake ^
            -S %SRCDIR% ^
            -B poco-build ^
            -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_INSTALL_PREFIX="%Poco_DIR%" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DENABLE_TESTS=OFF ^
            -DENABLE_SAMPLES=OFF

          cmake --build poco-build --config Release
          cmake --install poco-build --config Release

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the plugin for each Blender version in parallel
  # ─────────────────────────────────────────────────────────────────────────
  build-plugin:
    name: Blender ${{ matrix.blender.version }}
    needs: build-poco
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        blender:
          # ── 4.5.0 ────────────────────────────────────────────────────────
          - version: "4.5.0"
            cmake_flag: "BUILD_BLENDER_4.5.0_PLUGIN"
            # Direct download from blender.org (no account needed, stable URL pattern)
            download_url: "https://download.blender.org/release/Blender4.5/blender-4.5.0-windows-x64.zip"
            zip_name: "blender-4.5.0-windows-x64.zip"
            inner_dir: "blender-4.5.0-windows-x64"

          # ── 5.0.0 ────────────────────────────────────────────────────────
          - version: "5.0.0"
            cmake_flag: "BUILD_BLENDER_5.0.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.0/blender-5.0.0-windows-x64.zip"
            zip_name: "blender-5.0.0-windows-x64.zip"
            inner_dir: "blender-5.0.0-windows-x64"

          # ── 5.1.0 ────────────────────────────────────────────────────────
          # Update download_url when 5.1 ships. Until then use a daily build:
          # https://builder.blender.org/download/daily/
          - version: "5.1.0"
            cmake_flag: "BUILD_BLENDER_5.1.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.1/blender-5.1.0-windows-x64.zip"
            zip_name: "blender-5.1.0-windows-x64.zip"
            inner_dir: "blender-5.1.0-windows-x64"

          # ── 5.2.0 ────────────────────────────────────────────────────────
          # Update download_url when 5.2 ships.
          - version: "5.2.0"
            cmake_flag: "BUILD_BLENDER_5.2.0_PLUGIN"
            download_url: "https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip"
            zip_name: "blender-5.2.0-windows-x64.zip"
            inner_dir: "blender-5.2.0-windows-x64"

    steps:
      # ── Checkout with submodules ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Restore Poco (built by build-poco job) ───────────────────────────
      - name: Restore Poco cache
        uses: actions/cache@v4
        with:
          path: ${{ env.Poco_DIR }}
          key: poco-${{ env.POCO_VERSION }}-vs2022-x64-release

      # ── Cache the extracted Blender install directory ────────────────────
      - name: Cache Blender install
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_ROOT }}\${{ matrix.blender.version }}
          key: blender-install-${{ matrix.blender.version }}

      # ── Download & extract Blender (skip if cached) ──────────────────────
      # We download the plain Blender Windows zip — the same file a user
      # would install. It contains the Python embed, .lib stubs, and all
      # headers the plugin needs. No separate source clone required.
      - name: Download Blender ${{ matrix.blender.version }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip  = "${{ runner.temp }}\${{ matrix.blender.zip_name }}"
          $dest = "${{ env.BLENDER_ROOT }}\${{ matrix.blender.version }}"

          Write-Host "Downloading Blender ${{ matrix.blender.version }}..."
          Invoke-WebRequest -Uri "${{ matrix.blender.download_url }}" `
                            -OutFile $zip `
                            -UseBasicParsing

          Write-Host "Extracting..."
          Expand-Archive -Path $zip `
                         -DestinationPath "${{ runner.temp }}\blender-extract" `
                         -Force

          # The zip contains one inner folder (e.g. blender-4.5.0-windows-x64\)
          $inner = "${{ runner.temp }}\blender-extract\${{ matrix.blender.inner_dir }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item "$inner\*" $dest

      # ── Run make_meshsync_dcc_plugin.bat ─────────────────────────────────
      # This is exactly what the official build docs prescribe.
      # It calls CMake to generate MeshSyncDCCPlugins.sln inside Plugins~/Build.
      # BLENDER_PATH is read by the bat to locate the Blender install we extracted.
      - name: Generate solution (make_meshsync_dcc_plugin.bat)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          set BLENDER_PATH=${{ env.BLENDER_ROOT }}\${{ matrix.blender.version }}
          set Poco_DIR=${{ env.Poco_DIR }}

          make_meshsync_dcc_plugin.bat %MESHSYNC_VERSION% -D${{ matrix.blender.cmake_flag }}=ON

      # ── msbuild ──────────────────────────────────────────────────────────
      - name: Build (msbuild)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          msbuild MeshSyncDCCPlugins.sln ^
            /t:Build ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /m /nologo

      # ── cmake_install.cmake ───────────────────────────────────────────────
      - name: Install (cmake_install.cmake)
        shell: cmd
        working-directory: Plugins~\Build
        run: |
          cmake -DBUILD_TYPE=Release -P cmake_install.cmake

      # ── Zip the Dist output ───────────────────────────────────────────────
      # The install step puts the plugin into Plugins~/Dist/
      # under a folder named MeshSyncClient_<version>_Blender<X.Y>
      - name: Package artifact
        shell: pwsh
        run: |
          $ver     = "${{ matrix.blender.version }}"
          $short   = ($ver -split '\.')[0..1] -join '.'
          $outName = "UnityMeshSync_Blender_${ver}_Windows"

          # Locate the Dist subfolder — glob in case the exact folder name varies
          $distDir = Get-ChildItem "Plugins~\Dist" -Directory |
                       Where-Object { $_.Name -match "Blender${short}" } |
                       Select-Object -First 1

          if (-not $distDir) {
            Write-Error "Could not find Dist output for Blender $short"
            exit 1
          }

          Compress-Archive -Path "$($distDir.FullName)\*" `
                           -DestinationPath "${outName}.zip" `
                           -Force
          Write-Host "Packaged: ${outName}.zip"

      # ── Upload ───────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityMeshSync-Blender-${{ matrix.blender.version }}-Windows
          path: "UnityMeshSync_Blender_${{ matrix.blender.version }}_Windows.zip"
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Create a GitHub Release when a version tag (v*) is pushed
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
          generate_release_notes: true
